openapi: 3.0.3
info:
  title: Go API Template
  version: 1.0.0
servers:
  - url: http://0.0.0.0:8000/api/v1
  - url: http://localhost:8000/api/v1
  - url: http://127.0.0.1:8000/api/v1
paths:
  /album:
    post:
      summary: アルバムの作成
      operationId: createAlbum
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlbumCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /album/{id}:
    get:
      summary: IDからアルバムを見つける
      operationId: getAlbumById
      parameters: # apiへアクセスする際のパラメータ
        - name: id
          in: path # パラメータの場所はパス内に指定
          required: true # parameteは必須
          schema:
            type: integer
      responses: # apiに対するレスポンス
        "200":
          description: OK
          content: # 返却されるresponseの値
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumResponse"
    patch:
      summary: IDを用いてアルバムを更新する
      operationId: updateAlbumById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlbumUpdateRequest"
        required: true
      responses:
        "200":
          description: update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a album by ID
      operationId: deleteAlbumById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Category:
      type: object # {a:"a"}オブジェクト形式
      properties:
        id:
          type: integer
        name:
          type: string
          enum:
            - food
            - music
            - sports
      required:
        - name
    ReleaseDate:
      type: string
      format: date
    Anniversary:
      type: integer
    AlbumResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        anniversary:
          $ref: "#/components/schemas/Anniversary"
        releaseDate:
          $ref: "#/components/schemas/ReleaseDate"
      required:
        - id
        - title
        - category
        - anniversary
        - releaseDate
    AlbumUpdateRequest:
      type: object
      properties:
        title:
          type: string
        category:
          $ref: "#/components/schemas/Category"
    AlbumCreateRequest:
      type: object
      properties: # Requestプロパティ
        title:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        releaseDate:
          $ref: "#/components/schemas/ReleaseDate"
      required:
        - title
        - category
        - releaseDate
    ErrorResponse: # Errorレスポンス
      type: object
      properties:
        message:
          type: string
      required:
        - message
